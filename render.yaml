services:
  - type: web
    name: shizumusicbot
    runtime: python
    plan: free

    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "python main.py"

    envVars:
      - key: AUTO_DELETE_CMD_DELAY
        value: "3"

      - key: AUTO_DELETE_EDITED_DELAY
        value: "25"

      - key: BOT_TOKEN
        sync: false

      - key: FLOOD_RATE
        value: "5"

      - key: FLOOD_WINDOW
        value: "5"

      - key: OWNER_ID
        value: "7734968911"

      - key: LOG_CHANNEL_ID
        value: "-1003744652244"

      - key: SPAM_MUTE_DURATION
        value: "600"

      - key: BOT_USERNAME
        value: "test1botg_bot"

      - key: DATABASE_URL
        sync: false

      - key: PYTHON_VERSION
        value: "3.10.13"

      - key: PORT
        value: "10000"
